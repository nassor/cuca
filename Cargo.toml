[package]
name = "cuca"
version = "0.7.0"
edition = "2024"
rust-version = "1.98"
description = "Compact Universal Client for Agents: an asynchronous LLM client that parses multi-modal SSE streams into typed blocks behind one unified request/response abstraction."
repository = "https://github.com/nassor/cuca"
homepage = "https://nassor.github.io/cuca/"
license = "Apache-2.0"
authors = ["Nassor Frazier-Silva <nassor@gmail.com>"]

# docs.rs builds with default features; default = [] would trip the lib.rs
# no-provider compile_error, so the docs build enables an explicit feature list:
# every feature except provider-local-cuda and provider-local-rocm, whose build
# scripts download a prebuilt LLVM bundle (docs.rs builds have no network).
# CI validates this same feature point (ALL_NO_LLVM in ci.yml).
[package.metadata.docs.rs]
features = [
    "provider-openai",
    "provider-anthropic",
    "provider-gemini",
    "provider-deepseek",
    "provider-llamacpp",
    "provider-vllm",
    "provider-lmstudio",
    "provider-local",
    "provider-local-gpu",
    "provider-local-vulkan",
    "provider-local-metal",
    "plugin-mcp",
    "plugin-sandbox",
    "plugin-memory",
    "plugin-guardrails",
    "plugin-subagent",
    "plugin-hitl",
    "plugin-web-search",
    "plugin-skills",
    "plugin-telemetry",
    "plugin-session-log",
    "plugin-redaction",
    "plugin-cost",
    "service-entity-extraction",
    "service-prompt-cache",
    "service-rate-limit",
    "service-replay",
    "service-scheduler",
    "service-speculative",
    "service-vector-store",
    "server",
    "server-tui",
]

# The provider gate in lib.rs fails the plain lib build cargo performs for the
# doctest pass, and this crate has no doctests, so that pass is disabled.
[lib]
doctest = false

# Dependency/feature split:
# - provider-local does not use tokio-stream (its stream is a plain mpsc receiver).
#   candle-core/candle-nn 0.11: candle-core hard-depends on tokenizers[onig], so the
#   tree builds C (onig_sys); the engine code itself is pure Rust. tokenizers is also a
#   direct optional dep for the converter's Engram token-map normalizers only (the
#   engine's tokenizer stays hand-written). Not used directly:
#   candle-transformers, hf-hub, memmap2, rayon, rand.
#   serde_json/preserve_order: chat templates see JSON maps in the order the caller wrote
#   them (DeepSeek V4.1 writes tool-call parameters and tool schemas in that order).
# - Core (unconditional): bytes, futures-core, memchr, serde, serde_json. They define
#   the public wire types, SSE parser, and response stream contract.
# - Network and runtime dependencies are optional. Every provider enables reqwest and
#   tokio-stream; plugins and services enable tokio and/or reqwest only when their
#   implementation directly needs them.
# - Cross-feature sharing is intentional: base64 (provider-anthropic + plugin-sandbox),
#   tracing (plugin-guardrails + plugin-telemetry + plugin-redaction), tiktoken-rs
#   (plugin-memory + plugin-cost), sha2 (provider-anthropic + service-prompt-cache +
#   provider-local), and reqwest/rustls (providers + plugin-web-search + provider-local).
#   reqwest is built with default-features = false; HTTPS users explicitly enable its
#   rustls backend.
# - opentelemetry_sdk is optional under plugin-telemetry (used only by that plugin's tests).
# - jsonschema is built with default-features = false: guardrails.rs only compiles inline
#   (in-document) schemas via validator_for/iter_errors and needs no $ref retrieval
#   (no resolve-http/resolve-file).
# - postcard is built with default-features = false plus use-std: its default
#   `heapless-cas` feature pulls in heapless, which this crate never uses, while
#   `use-std` supplies the std Vec/COBS helpers and flavors. It is owned jointly by
#   plugin-session-log (framed record storage) and service-prompt-cache (digest input).
# - The URL_SAFE engine is base64::engine::general_purpose::URL_SAFE_NO_PAD (base64 is
#   enabled with no cargo features).
# rmcp 3.x: the client SDK (`client`) and the client transports stdio
# (`transport-child-process`) and Streamable HTTP (`transport-streamable-http-client-reqwest`)
# are opt-in features. WebSocket is not implemented in rmcp 3.x, so
# `McpTransport::WebSocket` maps to `PluginError::NotSupported` in the plugin.
[features]
default = []
# Explicit model provider adapters. At least one is required by lib.rs.
provider-openai = ["dep:reqwest", "dep:tokio-stream", "reqwest/rustls"]
provider-anthropic = ["dep:reqwest", "dep:tokio-stream", "dep:sha2", "dep:getrandom", "dep:base64", "reqwest/rustls"]
provider-gemini = ["dep:reqwest", "dep:tokio-stream", "reqwest/rustls"]
provider-deepseek = ["dep:reqwest", "dep:tokio-stream", "reqwest/rustls"]
provider-llamacpp = ["dep:reqwest", "dep:tokio-stream", "reqwest/rustls"]
provider-vllm = ["dep:reqwest", "dep:tokio-stream", "reqwest/rustls"]
provider-lmstudio = ["dep:reqwest", "dep:tokio-stream", "reqwest/rustls"]
# provider-local: in-process GGUF language-model inference on CPU or GPU (src/provider/local/). Pure Rust:
# no HTTP endpoint, no llama.cpp. reqwest is used only for the one-time model download
# (a private client, not the CucaClient HTTP client); sha2 verifies the downloaded file;
# sysinfo's disk list answers the converter's free-space preflight.
provider-local = ["dep:candle-core", "dep:candle-nn", "dep:half", "dep:minijinja", "dep:minijinja-contrib", "dep:reqwest", "dep:sha2", "dep:sysinfo", "dep:tokio", "dep:tokenizers", "dep:unicode-general-category", "dep:wide", "reqwest/rustls", "serde_json/preserve_order"]
# provider-local GPU backends (burn 0.22 / CubeCL). provider-local-gpu is the shared
# engine; it selects no backend by itself and is enabled by each backend feature.
# The graphics backends are Rust (wgpu: SPIR-V for vulkan, MSL for metal), but
# CubeCL's runtime pulls an embedded store (turso) that compiles C (simsimd, aegis;
# provider-local already needs a C compiler) and, on Windows, runs the SDK resource
# compiler (rc.exe; windres on GNU) in a build script.
# cuda/rocm link a prebuilt LLVM that tracel-llvm-bundler downloads on first build
# (network required; excluded from docs.rs and from the CI all-features jobs; rocm
# runs on Linux only).
provider-local-gpu = ["provider-local", "dep:burn", "dep:burn-cubecl", "dep:cubecl"]
provider-local-vulkan = ["provider-local-gpu", "burn/vulkan"]
provider-local-metal = ["provider-local-gpu", "burn/metal"]
provider-local-cuda = ["provider-local-gpu", "burn/cuda"]
provider-local-rocm = ["provider-local-gpu", "burn/rocm"]
# Essential agentic & infrastructural capability plugins: each implements CucaPlugin
# and runs on the request pipeline. The tier is flat — no plugin feature enables
# another plugin feature, and none may name a service-* feature.
plugin-mcp = ["dep:rmcp", "dep:tokio"]
# plugin-sandbox: enables wasmtime's `wat` feature so the tests pass WAT text, and reuses
# the optional base64 for the `wasm` tool-call argument decoding.
plugin-sandbox = ["dep:wasmtime", "dep:base64", "wasmtime/wat"]
plugin-memory = ["dep:tiktoken-rs"]
plugin-guardrails = ["dep:jsonschema", "dep:tracing"]
plugin-subagent = ["dep:tokio"]
plugin-hitl = ["dep:tokio"]
# Self-contained HTTPS: reqwest is built with default-features = false, so this feature
# enables the TLS backend itself (no provider feature needed for HTTPS web search).
plugin-web-search = ["dep:reqwest", "dep:tokio", "reqwest/rustls"]
# Reusable agent skills: SKILL.md instructions + skill/skill_read/skill_search tools (agentskills.io).
plugin-skills = []
plugin-telemetry = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:tracing"]
# plugin-session-log: postcard encodes each stored record; the session log is the
# only postcard *decode* path in the crate.
plugin-session-log = ["dep:postcard"]
# Outbound PII/secret scrubbing over every text-bearing request field. Reuses the
# optional `tracing` (also owned by plugin-guardrails and plugin-telemetry) for the
# per-redaction structural event; the matchers are built on the core `memchr`.
plugin-redaction = ["dep:tracing"]
# plugin-cost: token/currency ledger with a hard budget cap. Shares the optional
# tiktoken-rs dependency with plugin-memory (same joint-ownership shape as sha2 for
# provider-anthropic + service-prompt-cache and postcard for plugin-session-log +
# service-prompt-cache); this is a shared *dependency*, not a feature edge to plugin-memory.
plugin-cost = ["dep:tiktoken-rs"]
# Explicit-call service capabilities (src/services/): each is driven by direct
# method calls rather than pipeline hooks, so none of them implements CucaPlugin.
# Tier order is core < plugins < services: a service feature MAY enable a plugin
# feature, the reverse edge is forbidden, and no service enables another service.
# service-entity-extraction: the extraction delta *is* a plugin-memory MemoryGraph,
# so this feature enables that plugin; it adds no dependency of its own.
service-entity-extraction = ["plugin-memory"]
# service-prompt-cache: client-owned local response cache; deterministic
# effective-request digesting via the existing optional sha2 dependency
# (provider-anthropic enables sha2 independently for its own request signing) over
# postcard-encoded digest input.
service-prompt-cache = ["dep:sha2", "dep:postcard"]
# service-rate-limit: client-side outbound throttling, a token bucket plus a
# concurrency cap. Reuses the already-optional tokio (`sync` for Semaphore,
# `time` for sleep/timeout); the async acquire path is the whole point of the
# capability, so no new crate.
service-rate-limit = ["dep:tokio"]
# service-replay: deterministic re-materialization of a recorded trajectory as an
# AgentResponseStream. Reads through plugin-session-log's `SessionBackend` seam;
# adds no dependency of its own.
service-replay = ["plugin-session-log"]
# service-scheduler: the explicit-call LLM call pipeline (per-backend priority
# scheduler, adaptive parallelism tuner, multi-backend dispatcher). Reuses the
# already-optional tokio (`sync` for Notify/watch/OnceCell, `time` for hold
# timers, `rt` for the hold sleeper and lazy-build JoinSet) and owns `tracing`
# for its `cuca::scheduler` spans (same shape as plugin-redaction).
service-scheduler = ["dep:tokio", "dep:tracing"]
# service-speculative: the fast/slow orchestrator. Reuses the already-optional
# tokio (spawned tier turns, latency deadlines) and tokio-stream. Its edge to
# plugin-session-log is documented-optional, not a feature edge:
# ModelOrchestrator::with_session_store is compiled out of existence without it.
service-speculative = ["dep:tokio", "dep:tokio-stream"]
# service-vector-store: implements the `VectorStore` offload seam declared in
# src/plugins/memory/mod.rs, so plugin-memory is a hard dependency; wide is the
# feature-owned SIMD kernel dependency for the retrieval scan.
service-vector-store = ["plugin-memory", "dep:wide"]
# server: the `cuca` binary's model server (src/server/): an OpenAI-compatible HTTP API
# (axum), the stats API, Prometheus metrics and system sampling over the in-process
# local engine. `sysinfo` (CPU/RAM/disk/process), `nvml-wrapper` (NVIDIA, loaded at run
# time, absent driver is a soft failure) and `wmi` (Windows GPU counters) feed
# `server::sysmon`. getrandom makes request ids; toml reads `--config`.
server = [
    "provider-local", "dep:axum", "dep:clap", "dep:tracing", "dep:tracing-subscriber",
    "dep:sysinfo", "dep:nvml-wrapper", "dep:wmi", "dep:winreg", "dep:toml", "dep:getrandom", "dep:tokio-stream",
    "tokio/net", "tokio/rt-multi-thread", "tokio/signal", "tokio/io-util",
]
# server-tui: the real-time terminal UI over the stats API (built after the server).
server-tui = ["server", "dep:ratatui", "dep:crossterm"]

[dependencies]
bytes = "1"
futures-core = "0.3"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", optional = true, default-features = false, features = ["json", "stream", "form"] }
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "time", "macros", "sync", "process"] }
tokio-stream = { version = "0.1", optional = true }
# Optional (dep:) dependencies, compiled only when their feature is enabled.
sha2 = { version = "0.11", optional = true }
getrandom = { version = "0.4", optional = true }
base64 = { version = "0.23", optional = true }
postcard = { version = "1", optional = true, default-features = false, features = ["use-std"] }
# rmcp 3.x default features compile the server SDK; the client SDK (`client`) and the
# client stdio (`transport-child-process`) / Streamable HTTP
# (`transport-streamable-http-client-reqwest`) transports are opt-in features
# (see the header note above).
rmcp = { version = "3", optional = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
wasmtime = { version = "48", optional = true }
tiktoken-rs = { version = "0.12", optional = true }
jsonschema = { version = "0.52", optional = true, default-features = false }
opentelemetry = { version = "0.32", optional = true }
# `testing` provides InMemoryMetricExporter; `metrics` is its signal feature.
# The plain `PeriodicReader` runs its export loop on a dedicated OS thread (no Tokio
# runtime needed), so the telemetry tests stay on the current-thread Tokio flavor.
opentelemetry_sdk = { version = "0.32", optional = true, features = ["metrics", "testing"] }
tracing = { version = "0.1", optional = true }
# wide: portable SIMD, stable-only by construction (`std::simd` is nightly, and
# this crate pins stable 1.98, forbids `unsafe` and reaches the vector units
# through it): `f32x8` for the vector store's cosine scan, and the i16 multiply-add
# and f32 lanes of provider-local's row-batched quantized matmul (`model/qmm.rs`).
wide = { version = "1.7", optional = true }
# provider-local: candle for CPU tensors and quantized matmul; half for f16 block
# scales; minijinja (+pycompat for the chat templates' Python string methods).
candle-core = { version = "0.11.0", optional = true, default-features = false }
candle-nn = { version = "0.11.0", optional = true, default-features = false }
half = { version = "2", optional = true }
minijinja = { version = "2.24", optional = true, features = ["loader"] }
minijinja-contrib = { version = "2.24", optional = true, features = ["pycompat"] }
# provider-local tokenizer: Unicode general categories for the hand-written BPE
# pre-tokenizer splitters (pure Rust, no dependencies).
unicode-general-category = { version = "1", optional = true }
# provider-local converter: the Hugging Face normalizers (NFKC, NFD, StripAccents,
# Lowercase, Replace, Strip) that DeepSeek-V4.1's Engram token map is defined by.
# candle-core already compiles this crate with the same features.
tokenizers = { version = "0.22", optional = true, default-features = false, features = ["onig"] }
# provider-local-gpu: burn (CubeCL) runs the forward pass on a GPU. burn's `default`
# features enable `optim`/`autodiff`, which inference never uses; the backend itself is
# chosen by the provider-local-{vulkan,metal,cuda,rocm} features.
burn = { version = "0.22", optional = true, default-features = false, features = ["std", "fusion", "autotune", "extension", "cubecl"] }
cubecl = { version = "0.11", optional = true, default-features = false, features = ["stdlib"] }
burn-cubecl = { version = "0.22", optional = true, default-features = false, features = ["std", "fusion", "autotune"] }
# server: HTTP framework, CLI, logging and system sampling (see the `server` feature).
axum = { version = "0.8", optional = true, default-features = false, features = ["tokio", "http1", "json", "query", "matched-path"] }
clap = { version = "4", optional = true, features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "json"] }
sysinfo = { version = "0.40", optional = true, default-features = false, features = ["system", "disk"] }
nvml-wrapper = { version = "0.13", optional = true }
toml = { version = "1", optional = true }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }

[target.'cfg(windows)'.dependencies]
wmi = { version = "0.18", optional = true, default-features = false }
winreg = { version = "0.56", optional = true }

# Test-only deps for the integration suite: `ctor` runs the `--mcp-echo-server`
# interceptor in tests/plugin_mcp.rs before libtest's main (that test binary
# re-executes itself as the MCP echo server — no external script fixture). The
# test binary's rmcp *server* usage (tool macros + `serve(stdio())`) comes from
# the plugin-mcp-gated main dependency: rmcp's default features already include
# the server SDK (`server`) and tool macros (`macros`); this entry only adds the
# `transport-io` feature (`tokio/io-std`) that `rmcp::transport::stdio()`
# needs, unified with the main dep's features for test builds only.
[dev-dependencies]
ctor = "1.0.13"
rmcp = { version = "3", features = ["transport-io"] }
tokio = { version = "1", features = ["rt", "time", "macros", "sync", "net", "io-util", "process", "io-std"] }
tokio-stream = "0.1"
# `schemars` is re-exported by rmcp, but the `JsonSchema` derive expansion
# references the `schemars` crate by name, so the test crate needs it as a
# direct dev-dependency to derive the `echo` tool's inputSchema.
schemars = "1"
# `divan` runs benches/vector_store.rs (harness = false); it is a bench-only
# harness and no test target uses it.
divan = "0.1"

# Documented demos (see examples/): each streams from llama.cpp's local
# OpenAI-compatible chat route, so they build only when the llama.cpp provider
# adapter is enabled.
[[example]]
name = "llamacpp_gemma"
path = "examples/llamacpp_gemma.rs"
required-features = ["provider-llamacpp"]

# local_model runs a GGUF language model in-process (CPU or GPU): `LocalModel` exists only
# when `provider-local` is enabled.
[[example]]
name = "local_model"
path = "examples/local_model.rs"
required-features = ["provider-local"]

[[example]]
name = "stream_all_blocks"
path = "examples/stream_all_blocks.rs"
required-features = ["provider-llamacpp"]

[[example]]
name = "custom_plugin"
path = "examples/custom_plugin.rs"
required-features = ["provider-llamacpp"]

# cost_otel additionally needs the two plugin features the core bridge is
# gated on: `OtelCostObserver` only exists when both are enabled.
[[example]]
name = "cost_otel"
path = "examples/cost_otel.rs"
required-features = ["provider-llamacpp", "plugin-cost", "plugin-telemetry"]

# rate_limit additionally needs the service feature the limiter lives behind:
# `RateLimiter` only exists when `service-rate-limit` is enabled.
[[example]]
name = "rate_limit"
path = "examples/rate_limit.rs"
required-features = ["provider-llamacpp", "service-rate-limit"]

# scheduler additionally needs the service feature the dispatcher lives behind:
# `Dispatcher` only exists when `service-scheduler` is enabled.
[[example]]
name = "scheduler"
path = "examples/scheduler.rs"
required-features = ["provider-llamacpp", "service-scheduler"]

# redaction additionally needs the plugin feature the scrubber lives behind:
# `RedactionPlugin` only exists when `plugin-redaction` is enabled.
[[example]]
name = "redaction"
path = "examples/redaction.rs"
required-features = ["provider-llamacpp", "plugin-redaction"]

# replay additionally needs the service feature the replay capability lives
# behind: `SessionReplay` only exists when `service-replay` is enabled, and that
# feature pulls in `plugin-session-log` for the recording half of the demo.
[[example]]
name = "replay"
path = "examples/replay.rs"
required-features = ["provider-llamacpp", "service-replay"]

# vector_store additionally needs the service feature the store lives behind:
# `InMemoryVectorStore` only exists when `service-vector-store` is enabled, and
# that feature pulls in `plugin-memory` for the offload seam half of the demo.
[[example]]
name = "vector_store"
path = "examples/vector_store.rs"
required-features = ["provider-llamacpp", "service-vector-store"]

# prompt_cache additionally needs the service feature the cache lives behind:
# `PromptCache` and `CucaClientBuilder::with_prompt_cache_config` only exist
# when `service-prompt-cache` is enabled.
[[example]]
name = "prompt_cache"
path = "examples/prompt_cache.rs"
required-features = ["provider-llamacpp", "service-prompt-cache"]

# entity_extraction additionally needs the service feature the extractor lives
# behind: `EntityExtractor` only exists when `service-entity-extraction` is
# enabled, and that feature pulls in `plugin-memory` for the mandatory
# delta-to-graph hand-off half of the demo.
[[example]]
name = "entity_extraction"
path = "examples/entity_extraction.rs"
required-features = ["provider-llamacpp", "service-entity-extraction"]

# speculative additionally needs the service feature the orchestrator lives
# behind: `ModelOrchestrator` only exists when `service-speculative` is
# enabled.
[[example]]
name = "speculative"
path = "examples/speculative.rs"
required-features = ["provider-llamacpp", "service-speculative"]

# cost additionally needs the plugin feature the ledger lives behind:
# `CostPlugin` only exists when `plugin-cost` is enabled.
[[example]]
name = "cost"
path = "examples/cost.rs"
required-features = ["provider-llamacpp", "plugin-cost"]

# memory additionally needs the plugin feature the compactor lives behind:
# `MemoryPlugin` only exists when `plugin-memory` is enabled.
[[example]]
name = "memory"
path = "examples/memory.rs"
required-features = ["provider-llamacpp", "plugin-memory"]

# session_log additionally needs the plugin feature the trajectory store lives
# behind: `SessionLogPlugin` only exists when `plugin-session-log` is enabled.
[[example]]
name = "session_log"
path = "examples/session_log.rs"
required-features = ["provider-llamacpp", "plugin-session-log"]

# telemetry additionally needs the plugin feature the instruments live behind:
# `OpenTelemetryPlugin` only exists when `plugin-telemetry` is enabled, and
# that feature carries the `opentelemetry_sdk` the demo reads its exporter from.
[[example]]
name = "telemetry"
path = "examples/telemetry.rs"
required-features = ["provider-llamacpp", "plugin-telemetry"]

# guardrails additionally needs the plugin feature the validator lives behind:
# `JsonGuardrailPlugin` only exists when `plugin-guardrails` is enabled.
[[example]]
name = "guardrails"
path = "examples/guardrails.rs"
required-features = ["provider-llamacpp", "plugin-guardrails"]

# hitl additionally needs the plugin feature the approval gate lives behind:
# `HitlPlugin` only exists when `plugin-hitl` is enabled.
[[example]]
name = "hitl"
path = "examples/hitl.rs"
required-features = ["provider-llamacpp", "plugin-hitl"]

# skills additionally needs the plugin feature the skill loader lives behind:
# `SkillsPlugin` only exists when `plugin-skills` is enabled.
[[example]]
name = "skills"
path = "examples/skills.rs"
required-features = ["provider-llamacpp", "plugin-skills"]

# sandbox additionally needs the plugin feature wasmtime lives behind:
# `SandboxPlugin` only exists when `plugin-sandbox` is enabled, and that
# feature also supplies the `wat` support the inline guest module relies on.
[[example]]
name = "sandbox"
path = "examples/sandbox.rs"
required-features = ["provider-llamacpp", "plugin-sandbox"]

# mcp additionally needs the plugin feature the connector lives behind:
# `McpPlugin` only exists when `plugin-mcp` is enabled. The MCP server the demo
# talks to is this same example binary re-executed with `--mcp-add-server`,
# which uses rmcp's server SDK through the `transport-io` dev-dependency.
[[example]]
name = "mcp"
path = "examples/mcp.rs"
required-features = ["provider-llamacpp", "plugin-mcp"]

# subagent additionally needs the plugin feature the fan-out lives behind:
# `SubagentPlugin` only exists when `plugin-subagent` is enabled.
[[example]]
name = "subagent"
path = "examples/subagent.rs"
required-features = ["provider-llamacpp", "plugin-subagent"]

# web_search additionally needs the plugin feature the retrieval bridge lives
# behind: `WebSearchPlugin` only exists when `plugin-web-search` is enabled,
# and that feature carries its own TLS backend for the outbound HTTPS call.
[[example]]
name = "web_search"
path = "examples/web_search.rs"
required-features = ["provider-llamacpp", "plugin-web-search"]

# The retrieval scan is the crate's hottest explicit-call path; this bench pins
# the SIMD kernel against a scalar baseline. A provider feature is required
# because the library refuses to build without one.
[[bench]]
name = "vector_store"
harness = false
required-features = ["provider-openai", "service-vector-store"]

# The `cuca` binary: the model server (`cuca serve`).
[[bin]]
name = "cuca"
path = "src/bin/cuca.rs"
required-features = ["server"]
