name: Docs
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A half-applied Pages deployment is worse than a queued one, so runs wait
  # instead of cancelling each other.
  group: pages
  cancel-in-progress: false
env:
  ZOLA_VERSION: 0.22.1
  ZOLA_SHA256: 0ca09aa40376aaa9ddfb512ff9ad963262ef95edb0d0f2d5ec6961b6f5cf22ef
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Zola
        run: |
          asset="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/zola.tar.gz" \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/${asset}"
          echo "${ZOLA_SHA256}  ${RUNNER_TEMP}/zola.tar.gz" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/zola-bin"
          tar -xzf "${RUNNER_TEMP}/zola.tar.gz" -C "${RUNNER_TEMP}/zola-bin" zola
          echo "${RUNNER_TEMP}/zola-bin" >> "${GITHUB_PATH}"
      - run: zola --version
      - run: zola build
        working-directory: docs
      - name: Link check
        # Gating: a broken `@/` link or an `[[extra.nav]]` path with no page fails here.
        run: zola check
        working-directory: docs
      - name: Build search index
        # `build_search_index = false` in config.toml, and base.html reads
        # `data-index="search-index.json"`, which only this script writes, by parsing the
        # rendered `public/` tree. Without this step the site's search box returns nothing.
        # `build-local.py` is not the deploy path: it rewrites base_url for `file://`.
        run: python3 search-index.py public
        working-directory: docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/public
  deploy:
    # Pull requests get the build and the link check above and stop here. A
    # `workflow_dispatch` on `main` deploys, which is how the site first goes live
    # after the Pages source is switched to GitHub Actions, and how a deploy that
    # failed for an infrastructure reason is retried without a dummy commit.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
