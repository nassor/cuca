name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Every feature except provider-local-cuda and provider-local-rocm, whose builds
# download a prebuilt LLVM bundle (checked alone in local_gpu_llvm). The same
# list is the docs.rs feature set in Cargo.toml. Matrix values reference it as
# $ALL_NO_LLVM, which the run step's shell expands.
env:
  ALL_NO_LLVM: "provider-openai,provider-anthropic,provider-gemini,provider-deepseek,provider-llamacpp,provider-vllm,provider-lmstudio,provider-local,provider-local-gpu,provider-local-vulkan,provider-local-metal,plugin-mcp,plugin-sandbox,plugin-memory,plugin-guardrails,plugin-subagent,plugin-hitl,plugin-web-search,plugin-skills,plugin-telemetry,plugin-session-log,plugin-redaction,plugin-cost,service-entity-extraction,service-prompt-cache,service-rate-limit,service-replay,service-scheduler,service-speculative,service-vector-store,server,server-tui"
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
  clippy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["--no-default-features --features provider-openai", "--no-default-features --features $ALL_NO_LLVM"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings
  no_provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: if cargo check --no-default-features; then echo "expected provider selection to fail"; exit 1; fi
  test:
    runs-on: ubuntu-latest
    # Every test, example and the lib test link the whole $ALL_NO_LLVM tree
    # (burn, wgpu, wasmtime, candle): with debug info that is 0.7 to 2 GB per
    # binary over 73 binaries and the runner runs out of disk mid-link
    # (rust-lld dies with SIGBUS). Without it the target is 12 GB. Panic
    # messages keep their file and line; backtraces keep function names.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    strategy:
      matrix:
        features: ["--no-default-features --features provider-openai", "--no-default-features --features $ALL_NO_LLVM"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test ${{ matrix.features }}
  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --no-default-features --features "$ALL_NO_LLVM"
  local_gpu_llvm:
    # The only job that builds the CUDA and ROCm backends: their build scripts
    # download a prebuilt LLVM (tracel-llvm-bundler) and ROCm's HIP bindings
    # load the HIP runtime at run time, so they build on Windows too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --no-default-features --features provider-local-cuda,provider-local-rocm
  plugin_solo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin:
          - plugin-mcp
          - plugin-sandbox
          - plugin-memory
          - plugin-guardrails
          - plugin-subagent
          - plugin-hitl
          - plugin-web-search
          - plugin-skills
          - plugin-telemetry
          - plugin-session-log
          - plugin-cost
          - plugin-redaction
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --no-default-features --features provider-openai,${{ matrix.plugin }}
  service_solo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - service-entity-extraction
          - service-speculative
          - service-replay
          - service-prompt-cache
          - service-rate-limit
          - service-vector-store
          - service-scheduler
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --no-default-features --features provider-openai,${{ matrix.service }}
  server_solo:
    # The `cuca` binary and the server module alone: `server` enables
    # provider-local itself, so no other provider is named.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature:
          - server
          - server-tui
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --no-default-features --features ${{ matrix.feature }}
  plugin_layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Flat-tier check
        run: |
          # The plugin tier is flat: prompt-cache, entity-extraction, replay,
          # speculative, and rate-limit moved out to the service tier, so
          # nothing under src/plugins/ may name a service -- not a service-*
          # feature, not a crate::services path, not the plugins:: path one of
          # those modules used to live at. A cfg(all(...)) reverse edge would
          # compile undetected in both the solo and all-features builds, so
          # this has to be caught by inspection.
          if grep -rnE 'service-|crate::services|plugins::(prompt_cache|entity_extraction|replay|rate_limit)' src/plugins/; then
            echo "layering violation: no plugin may name a service, in any form"
            exit 1
          fi
