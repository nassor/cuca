name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
  clippy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["--no-default-features --features provider-openai", "--all-features"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings
  no_provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: if cargo check --no-default-features; then echo "expected provider selection to fail"; exit 1; fi
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["--no-default-features --features provider-openai", "--all-features"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test ${{ matrix.features }}
  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
  plugin_solo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin:
          - plugin-mcp
          - plugin-sandbox
          - plugin-memory
          - plugin-guardrails
          - plugin-subagent
          - plugin-hitl
          - plugin-web-search
          - plugin-skills
          - plugin-telemetry
          - plugin-session-log
          - plugin-cost
          - plugin-redaction
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --no-default-features --features provider-openai,${{ matrix.plugin }}
  service_solo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - service-entity-extraction
          - service-speculative
          - service-replay
          - service-prompt-cache
          - service-rate-limit
          - service-vector-store
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --no-default-features --features provider-openai,${{ matrix.service }}
  plugin_layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Flat-tier check
        run: |
          # The plugin tier is flat: prompt-cache, entity-extraction, replay,
          # speculative, and rate-limit moved out to the service tier, so
          # nothing under src/plugins/ may name a service -- not a service-*
          # feature, not a crate::services path, not the plugins:: path one of
          # those modules used to live at. A cfg(all(...)) reverse edge would
          # compile undetected in both the solo and all-features builds, so
          # this has to be caught by inspection.
          if grep -rnE 'service-|crate::services|plugins::(prompt_cache|entity_extraction|replay|rate_limit)' src/plugins/; then
            echo "layering violation: no plugin may name a service, in any form"
            exit 1
          fi
