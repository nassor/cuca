<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" width="660" height="250" role="img" aria-labelledby="title desc">
  <title id="title">The balancer in front of three model servers.</title>
  <desc id="desc">HTTP clients that speak the OpenAI API call the balancer, the balance section of a cuca run file. The balancer picks one of three model servers for each request, by prefix affinity, least load or round robin, and streams the answer back. It polls /health, /v1/models and the stats API at /cuca/v1/stats of each server, every second by default.</desc>
  <style>
    .frame { fill: #fafafa; stroke: #e4e4e7; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #71717a; }
    .t-title { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; fill: #09090b; }
    .t-lbl { font-size: 12px; fill: #09090b; }
    .t-ax { font-size: 10px; }
    .t-mid { text-anchor: middle; }
    .t-data { fill: #b65b0c; }
    .t-ctl { fill: #0a7166; }
    .t-bnd { fill: #7030c6; }
    .blk { fill: #ffffff; stroke: #d4d4d8; stroke-width: 1; }
    .blk-data { stroke: #b65b0c; }
    .blk-ctl { stroke: #0a7166; }
    .blk-bnd { stroke: #7030c6; }
    .arw { fill: none; stroke: #71717a; stroke-width: 1.5; }
    .arw-data { stroke: #b65b0c; }
    .arw-ctl { stroke: #0a7166; }
    .arw-bnd { stroke: #7030c6; stroke-dasharray: 5 4; }
    .head { fill: #71717a; }
    .head-data { fill: #b65b0c; }
    .head-ctl { fill: #0a7166; }
    .head-bnd { fill: #7030c6; }
    @media (prefers-color-scheme: dark) {
      .frame { fill: #111114; stroke: #2a2a30; }
      text { fill: #a1a1aa; }
      .t-title, .t-lbl { fill: #fafafa; }
      .t-data { fill: #fba337; }
      .t-ctl { fill: #29c7b2; }
      .t-bnd { fill: #bb8df6; }
      .blk { fill: #1b1b1f; stroke: #35353b; }
      .blk-data { stroke: #fba337; }
      .blk-ctl { stroke: #29c7b2; }
      .blk-bnd { stroke: #bb8df6; }
      .arw { stroke: #a1a1aa; }
      .arw-data { stroke: #fba337; }
      .arw-ctl { stroke: #29c7b2; }
      .arw-bnd { stroke: #bb8df6; }
      .head { fill: #a1a1aa; }
      .head-data { fill: #fba337; }
      .head-ctl { fill: #29c7b2; }
      .head-bnd { fill: #bb8df6; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path class="head" d="M0 0.6 L7 4 L0 7.4 z"/></marker>
    <marker id="a-data" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path class="head-data" d="M0 0.6 L7 4 L0 7.4 z"/></marker>
    <marker id="a-ctl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path class="head-ctl" d="M0 0.6 L7 4 L0 7.4 z"/></marker>
    <marker id="a-bnd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path class="head-bnd" d="M0 0.6 L7 4 L0 7.4 z"/></marker>
  </defs>
  <rect class="frame" x="0.5" y="0.5" width="659" height="249" rx="12"/>
  <text class="t-title" x="20" y="32">Load balancer: the balance section</text>
  <rect class="blk" x="20" y="102" width="130" height="50" rx="6"/>
  <text class="t-lbl t-mid" x="85" y="123">HTTP clients</text>
  <text class="t-mid" x="85" y="140">OpenAI API</text>
  <rect class="blk blk-data" x="190" y="92" width="190" height="70" rx="6"/>
  <text class="t-lbl t-mid t-data" x="285" y="116">balance</text>
  <text class="t-mid" x="285" y="134">prefix-affinity,</text>
  <text class="t-mid" x="285" y="150">least-loaded or round-robin</text>
  <rect class="blk blk-data" x="450" y="48" width="190" height="46" rx="6"/>
  <text class="t-lbl t-mid t-data" x="545" y="67">serve</text>
  <text class="t-mid" x="545" y="84">http://10.0.0.1:8000</text>
  <rect class="blk blk-data" x="450" y="104" width="190" height="46" rx="6"/>
  <text class="t-lbl t-mid t-data" x="545" y="123">serve</text>
  <text class="t-mid" x="545" y="140">http://10.0.0.2:8000</text>
  <rect class="blk blk-data" x="450" y="160" width="190" height="46" rx="6"/>
  <text class="t-lbl t-mid t-data" x="545" y="179">serve</text>
  <text class="t-mid" x="545" y="196">http://10.0.0.3:8000</text>
  <path class="arw arw-data" d="M152 127 H186" marker-end="url(#a-data)"/>
  <path class="arw arw-data" d="M382 118 L446 73" marker-end="url(#a-data)"/>
  <path class="arw arw-data" d="M382 127 H446" marker-end="url(#a-data)"/>
  <path class="arw arw-data" d="M382 136 L446 181" marker-end="url(#a-data)"/>
  <text class="t-ax" x="20" y="232">Polls /health, /v1/models and /cuca/v1/stats of each server, every second by default.</text>
</svg>
