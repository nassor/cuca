base_url = "https://nassor.github.io/cuca"
title = "CUCA Documentation"
description = "An asynchronous Rust client for LLM backends: one unified request, one typed block stream, eight provider adapters."
default_language = "en"
compile_sass = false
build_search_index = false
generate_feeds = false

# Output to docs/public so a GitHub Pages workflow can upload it.
output_dir = "public"

# Pretty URLs (default true): /world.md -> /world/
[markdown]
render_emoji = false

# Class mode keeps the inline `style` attribute off `<pre>`, so the site's own
# light/dark rules and the `data-theme` toggle still paint the code frame.
# Zola writes a `giallo.css` for the theme below; no page links it, because the
# Prism `.token.*` rules in `styles.css` colour the tokens. The section exists
# so a fence annotation such as ```rust,name=The build script reaches the page
# as `data-name`, which `script.js` renders as the frame caption.
[markdown.highlighting]
theme = "ayu-dark"
style = "class"

[extra]
# `github_repo` is read by `base.html`, for the header icon and the sidebar note.
github_repo = "https://github.com/nassor/cuca"
# `docs_rs` is declared but deliberately not linked from any template: docs.rs
# builds from a crates.io release, and `cuca-core` is not published, so the URL
# would 404 today. `crates_io` is omitted for the same reason.
docs_rs = "https://docs.rs/cuca-core"

# The reading order, declared once. `base.html` renders the sidebar, the
# breadcrumb and the previous/next pager from this list, so all three agree.
# A group lists its hub (`_index.md`) and its pages as sibling items. An item
# with `[[extra.nav.items.children]]` nests those pages under it, as the Local
# provider's subpages sit under Local (in-process).
